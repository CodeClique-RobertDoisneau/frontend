<div class="chapter-showcase">
  <div class="admin-controls">
    <button mat-stroked-button (click)="toggleRole()">
      {{ isAdmin() ? '👑 Mode Admin' : '🎓 Mode Élève' }}
    </button>
  </div>

  @if (chapterData()) {
    <app-chapter-menu 
      [chapter]="chapterData()!" 
      [isAdmin]="isAdmin()">
    </app-chapter-menu>
  } @else {
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  }
</div>
