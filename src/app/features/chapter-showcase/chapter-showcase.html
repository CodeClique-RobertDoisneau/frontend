<div class="chapter-showcase">
  <div class="admin-controls">
    <button mat-stroked-button (click)="toggleRole()">
      {{ isAdmin ? '👑 Mode Admin' : '🎓 Mode Élève' }}
    </button>
  </div>

  <ng-container *ngIf="chapterData; else loading">
    <app-chapter-menu 
      [chapter]="chapterData" 
      [isAdmin]="isAdmin">
    </app-chapter-menu>
  </ng-container>
  <ng-template #loading>
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </ng-template>
</div>
