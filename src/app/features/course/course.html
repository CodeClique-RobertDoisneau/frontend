<div class="course-container">
  @if (data(); as d) {
  <div class="content-layout">
    <!-- Back FAB (Sticky Column) -->
    <button mat-fab class="back-fab" (click)="goBack()" color="primary" aria-label="Go back">
      <mat-icon>arrow_back</mat-icon>
    </button>

    <!-- Main Content Column -->
    <main class="main-column">
      <h1 class="chapter-title">{{ d.item.title }}</h1>

      <!-- Paginator moved between title and content -->
      <div class="paginator-wrapper">
        <mat-paginator [length]="d.section?.children?.length || 0" [pageSize]="1" [pageIndex]="currentIndex()"
          (page)="onPageChange($event)" hidePageSize showFirstLastButtons aria-label="Select item">
        </mat-paginator>
      </div>

      <div class="content-wrapper">
        @if (d.item.type === 'QU' || d.item.type === 'QUIZZ' || d.item.title.toLowerCase().includes('qui')) {
        <app-quiz [quizData]="d.item.content"></app-quiz>
        } @else {
        <app-markdown-viewer [markdown]="d.item.content?.data || ''" [pyodide]="this.pyodide"
          [packages]="['numpy']"></app-markdown-viewer>
        }
      </div>
    </main>

    <!-- TOC Sidebar -->
    <aside class="toc-sidebar">
      @if (dataSource.data.length > 0) {
      <h3 class="toc-header">Table of Contents</h3>
      <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="toc-tree">
        <!-- Leaf Node -->
        <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle>
          <button mat-button (click)="scrollToHeader(node.name)" class="toc-link">
            {{ node.name }}
          </button>
        </mat-tree-node>

        <!-- Expandable Node -->
        <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
          <div class="mat-tree-node">
            <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
              <mat-icon class="mat-icon-rtl-mirror">
                {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
              </mat-icon>
            </button>
            <button mat-button (click)="scrollToHeader(node.name)" class="toc-link">
              {{ node.name }}
            </button>
          </div>
          <div [class.toc-invisible]="!treeControl.isExpanded(node)" role="group">
            <ng-container matTreeNodeOutlet></ng-container>
          </div>
        </mat-nested-tree-node>
      </mat-tree>
      }
    </aside>

  </div>
  } @else {
  <div class="loading-container">
    <mat-spinner diameter="48"></mat-spinner>
    <p>Loading course content...</p>
  </div>
  }
</div>
