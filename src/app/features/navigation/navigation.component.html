<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport
      [attr.role]="(isHandset$ | async) ? 'dialog' : 'navigation'"
      [mode]="(isHandset$ | async) ? 'over' : 'side'"
      [opened]="(isHandset$ | async) === false">
    <div class="sidenav-layout-wrapper">
      <a routerLink="/" class="logo-wrapper">
        <img src="img/CodeClique.webp" alt="App logo" class="logo">
      </a>
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" aria-label="Dashboard menu button">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span> 
        </a>
        <a mat-list-item routerLink="/free-python-ide" aria-label="Free Python IDE menu button">
          <mat-icon matListItemIcon>terminal</mat-icon>
          <span matListItemTitle>Editeur Python</span>
        </a>
        <a mat-list-item routerLink="/courses" aria-label="Courses menu button">
          <mat-icon matListItemIcon>school</mat-icon>
          <span matListItemTitle>Tous les cours</span>
        </a>
        
        <div class="vertical-fill"></div>
        
        <a mat-list-item routerLink="/profile" aria-label="Profile menu button">
          <mat-icon matListItemIcon>account_circle</mat-icon>
          <span matListItemTitle>Mon Profil</span>
        </a>
        <a mat-list-item routerLink="/settings" aria-label="Settings menu button">
          <mat-icon matListItemIcon>settings</mat-icon>
          <span matListItemTitle>Paramètres</span>
        </a>
      </mat-nav-list>
    </div>
  </mat-sidenav>


  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isHandset$ | async) {
        <button
        type="button"
          aria-label="Toggle sidenav"
          matIconButton
          (click)="drawer.toggle()">
          <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
        </button>
      }
      <span>{{ title() }}</span>
      <span class="toolbar-spacer"></span>
      <mat-button-toggle-group
        [value]="theming.theme()"
        (change)="theming.setTheme($event.value)"
        hideSingleSelectionIndicator="true"
        aria-label="Font Style"
      >
        <mat-button-toggle value="auto"><mat-icon>brightness_auto</mat-icon></mat-button-toggle>
        <mat-button-toggle value="light"><mat-icon>brightness_low</mat-icon></mat-button-toggle>
        <mat-button-toggle value="dark"><mat-icon>brightness_high</mat-icon></mat-button-toggle>
      </mat-button-toggle-group>
    </mat-toolbar>
    <div class="main-container">
      <router-outlet /> 
    </div>
    <app-footer></app-footer>
  </mat-sidenav-content>
</mat-sidenav-container>
