<mat-card appearance="outlined">
    <mat-card-header>
        <mat-card-title>Évolution de mes points</mat-card-title>
    </mat-card-header>

    <mat-card-content>
        <div style="height: 300px; padding: 20px;">
            <canvas baseChart [data]="chartData" [options]="chartOptions" [type]="chartType"></canvas>
        </div>
    </mat-card-content>
</mat-card>
