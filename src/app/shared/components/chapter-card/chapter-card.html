@if (chapterInfo.isLoading()) {
<mat-progress-bar mode="indeterminate"></mat-progress-bar>
}
@else if (chapterInfo.value(); as chapter) {
<mat-card class="example-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ chapter.title }}</mat-card-title>
    <span class="material-symbols-outlined menu-icon"> </span>
    <mat-card-subtitle>{{ chapter.grade_level }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p>
      {{ chapter.description }}
    </p>
  </mat-card-content>

  <mat-card-actions>
    <button matButton="outlined">Plan</button>
    <button matButton="filled">Continuer</button>
  </mat-card-actions>
</mat-card>
}
@else if (chapterInfo.error()) {
<div class="error-msg" role="alert">
  Impossible de charger les chapitres. Veuillez réessayer plus tard.
</div>
}
