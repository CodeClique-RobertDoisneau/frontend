<mat-accordion class="chapter-accordion" displayMode="flat">
  @for (chapter of chapters(); track chapter.id) {
    <mat-expansion-panel [expanded]="activeChapterId() === chapter.id">
      <mat-expansion-panel-header>
        <mat-panel-title class="chapter-title">
          {{ chapter.title }}
        </mat-panel-title>
      </mat-expansion-panel-header>

      <mat-nav-list>
        @for (section of chapter.sections; track section.id) {
          <a mat-list-item 
             [routerLink]="['/chapter', chapter.id]" 
             [fragment]="section.id"
             [activated]="activeSectionId() === section.id">
            <span matListItemTitle>{{ section.title }}</span>
            <mat-icon matListItemIcon>article</mat-icon>
          </a>
        }
      </mat-nav-list>
    </mat-expansion-panel>
  }
</mat-accordion>
