<!-- Full interactive view for Python -->
@if (language() === "python") {
  <div class="code-block-interactive">
    <div class="code-overlay">
      <div class="button-group">
        <button matIconButton (click)="copy()" matTooltip="Copy code">
          <mat-icon>content_copy</mat-icon>
        </button>
        <button matIconButton (click)="reset()" matTooltip="Reset code">
          <mat-icon>refresh</mat-icon>
        </button>
        @if (!isRunning()) {
          @if (!pyodide.isReady()) {
            <button matIconButton disabled matTooltip="Loading python...">
              <mat-progress-spinner diameter="24" mode="indeterminate"></mat-progress-spinner>
            </button>
          } @else {
            <button matIconButton (click)="run()" matTooltip="Run code">
              <mat-icon>play_arrow</mat-icon>
            </button>
          }
        } @else {
          <button matIconButton (click)="stop()" matTooltip="Stop execution">
            <mat-icon>stop</mat-icon>
          </button>
        }
      </div>
    </div>

    <code-editor [(ngModel)]="code" [languages]="languages" [theme]="this.theming.resolvedTheme()" language="python" />

    @if (output()) {
      <div class="python-output">
        <div class="output-header">
          <span>Out:</span>
        </div>
        <pre class="output-content">{{ output() }}</pre>
      </div>
    }

    @if (error()) {
      <div class="python-error">
        <div class="error-header">
          <span>Error:</span>
        </div>
        <pre class="error-content">{{ error() }}</pre>
      </div>
    }

    @if (plot()) {
      <div class="python-plot">
        <img [src]="'data:image/png;base64,' + plot()" alt="Plot" />
      </div>
    }
  </div>
}

<!-- Minimal view for other languages -->
@else {
  <div class="code-block-minimal">
    <div class="code-overlay">
      <span class="language-label">{{ language() || 'text' }}</span>
      <button matIconButton (click)="copy()" matTooltip="Copy code">
        <mat-icon>content_copy</mat-icon>
      </button>
    </div>

    <code-editor [(ngModel)]="code" [languages]="languages" [theme]="theming.resolvedTheme()" [language]="language()" readonly="true" setup="minimal" />
  </div>
}
