@if (nodeInfo.isLoading()) {
<div class="loading-container">
  <mat-spinner diameter="40"></mat-spinner>
</div>
} @else if (nodeInfo.value(); as node) {
<div class="slider-wrapper">
  @if (showLeftArrow()) {
  <button mat-icon-button class="nav-btn left" (click)="scroll(-400)">
    <mat-icon>chevron_left</mat-icon>
  </button>
  }

  <app-persona [subject]="node.subject || 'MA'"></app-persona>

  <div class="slider-content" #sliderContent (scroll)="onScroll($event)">
    @for (child of chapters(); track child) {
    <app-chapter-card [id]="getChapterId(child)" class="slider-item" />
    }
  </div>

  @if (showRightArrow()) {
  <button mat-icon-button class="nav-btn right" (click)="scroll(400)">
    <mat-icon>chevron_right</mat-icon>
  </button>
  }
</div>
} @else if (nodeInfo.error()) {
<div class="error-container">
  <p>Erreur de chargement du syllabus (ID: {{ id() }})</p>
</div>
}
