<div class="slider-container">
  <div class="buttons-wrapper">
    <button matIconButton class="nav-btn left" (click)="scrollLeft()" aria-label="Précédent">
      <mat-icon>arrow_circle_left</mat-icon>
    </button>
    <button matIconButton class="nav-btn right" (click)="scrollRight()" aria-label="Suivant">
      <mat-icon>arrow_circle_right</mat-icon>
    </button>
  </div>

  <div class="slider-content" #sliderContent>
    @for (chapter of chapters.value(); track chapter.id) {
    <app-chapter-card [id]="chapter.id" class="slider-item"></app-chapter-card>
    } @empty {
    <p class="empty-msg">Aucun contenu à afficher pour le moment.</p>
    }
  </div>
</div>
