<mat-expansion-panel class="section-panel" (opened)="onOpen()">
  <mat-expansion-panel-header>
    <div class="panel-header-content">
      <div class="header-info">
        <mat-panel-title class="section-title">
          {{ section().title }}
        </mat-panel-title>
        <mat-panel-description>
          {{ section().description }}
        </mat-panel-description>
      </div>

      <div class="progress-wrapper">
        <span class="progress-text">{{ progress() }}%</span>
        <mat-progress-bar mode="determinate" [value]="progress()" class="mini-progress"></mat-progress-bar>
      </div>
    </div>
  </mat-expansion-panel-header>

  @if (isLoading()) {
  <div class="loading-state">
    Loading items...
  </div>
  } @else if (error()) {
  <div class="error-state">
    Error loading items.
  </div>
  } @else if (items(); as itemList) {
  <mat-nav-list>
    @for (childId of itemList; track childId) {
    <app-chapter-child [id]="childId"></app-chapter-child>
    } @empty {
    <div class="empty-state">Aucun élément dans cette section.</div>
    }
  </mat-nav-list>
  }
</mat-expansion-panel>
